[package]
name = "synapse-desktop"
version = "1.0.0"
description = "Synapse - Local-First Research Assistant and Evidence Graph Engine"
authors = ["Synapse Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
